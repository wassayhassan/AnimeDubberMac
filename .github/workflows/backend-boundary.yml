name: Backend boundary tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  service-protocol-cli:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Source preflight
        run: python verify_source.py

      - name: Test application service boundary
        run: python -m unittest tests.test_application_service tests.test_transport_protocol tests.test_cli tests.test_project_store -v

      - name: CLI help smoke test
        run: python -m anime_dubber.cli --help

      - name: Backend hello smoke test
        shell: bash
        run: |
          printf '%s\n' '{"type":"request","id":"1","method":"hello","params":{}}' '{"type":"request","id":"2","method":"shutdown","params":{}}' |
          python -m anime_dubber.transport.stdio_server
