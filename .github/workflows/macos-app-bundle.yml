name: macOS app bundle

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned lightweight app bundle
        run: zsh macos/package_app.sh --no-embed-venv --no-sign

      - name: Validate bundle
        run: |
          test -x dist/AnimeDubber.app/Contents/MacOS/AnimeDubber
          test -f dist/AnimeDubber.app/Contents/Info.plist
          test -f dist/AnimeDubber.app/Contents/Resources/AnimeDubber.icns
          test -f dist/AnimeDubber.app/Contents/Resources/backend/anime_dubber/core.py
          plutil -lint dist/AnimeDubber.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeDubber-macOS-lightweight
          path: dist/AnimeDubber.app
